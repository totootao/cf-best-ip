name: Build and Push (ghcr.io + Docker Hub)

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write   # 推送 ghcr.io 必需

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ===== ghcr.io：使用内置 GITHUB_TOKEN，始终推送 =====
      - name: Login to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push ghcr (python:alpine)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository }}:latest

      - name: Build & push ghcr (alpine-shell)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.alpine-shell
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ghcr.io/${{ github.repository }}:shell

      # ===== Docker Hub：需要 PAT（Access Token），由仓库变量 PUSH_DOCKERHUB 控制开关 =====
      # 未配置有效 PAT 时保持 false，避免构建变红；配好 PAT 后把该变量设为 true 即启用。
      - name: Login to Docker Hub
        if: ${{ vars.PUSH_DOCKERHUB == 'true' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & push Docker Hub (python:alpine)
        if: ${{ vars.PUSH_DOCKERHUB == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: tootootao/cf-best-ip:latest

      - name: Build & push Docker Hub (alpine-shell)
        if: ${{ vars.PUSH_DOCKERHUB == 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.alpine-shell
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: tootootao/cf-best-ip:shell
